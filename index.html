<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1C17">
<title>BON31 会議室（プレビュー）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1C17; --s1:#16261F; --s2:#1D3129; --line:#2A4035; --line2:#365246;
    --text:#E6ECE5; --sub:#93A69B; --dim:#6E8278;
    --gold:#CBAA67; --gold-d:#9C8048; --gold-t:rgba(203,170,103,.12);
    --yama:#8FB3E0; --ohara:#E39B74; --oai:#7FC4B0; --claude:#BDB0E6;
    --danger:#E07A6E;
    --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --gothic:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--gothic);font-size:15px;line-height:1.75;letter-spacing:.02em}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
  svg{display:block}

  /* ヘッダー */
  header{position:sticky;top:0;z-index:20;background:rgba(15,28,23,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
  .mark{width:30px;height:30px;color:var(--gold);flex:none}
  header h1{font-family:var(--mincho);font-weight:700;font-size:20px;letter-spacing:.08em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .back{width:30px;height:30px;display:grid;place-items:center;color:var(--sub);flex:none}
  .me{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);border:1px solid var(--line2);border-radius:999px;padding:4px 10px 4px 5px}
  .me .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--bg)}
  .note{font-size:11.5px;color:var(--dim);padding:8px 20px;border-bottom:1px solid var(--line)}

  main{padding:20px 20px calc(110px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}

  /* 下ナビ */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(15,28,23,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--dim);padding:6px 0}
  nav button svg{width:22px;height:22px}
  nav button.on{color:var(--gold)}

  /* 共通 */
  .sec-title{font-family:var(--mincho);font-weight:700;font-size:17px;letter-spacing:.06em;margin:0 0 12px}
  .muted{color:var(--sub);font-size:13px}
  .btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;
    background:var(--gold);color:#1A1408;transition:transform .12s ease}
  .btn:active{transform:scale(.97)}
  .btn.line{background:transparent;color:var(--text);border:1px solid var(--line2);font-weight:500}
  .btn.danger{background:var(--danger);color:#fff}
  .btn.sm{padding:6px 14px;font-size:12.5px}
  input[type=text],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
  input::placeholder,textarea::placeholder{color:var(--dim)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-d)}
  textarea{resize:vertical;line-height:1.6}

  /* 会議一覧 */
  .start{display:flex;gap:8px;margin-bottom:28px}
  .start input{border-radius:999px;padding-left:18px}
  .mlist{border-top:1px solid var(--line)}
  .mrow{display:block;width:100%;text-align:left;padding:16px 2px;border-bottom:1px solid var(--line)}
  .mrow .t{font-family:var(--mincho);font-weight:700;font-size:16.5px;letter-spacing:.04em;display:block}
  .mrow .l{display:block;color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .meta{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--dim)}
  .mrow .meta .g{color:var(--gold)}
  .empty{color:var(--sub);text-align:center;padding:40px 0}

  /* スレッド */
  .thread{padding-top:4px}
  .h-say{margin:18px 0;padding:2px 0 2px 14px;border-left:2px solid var(--who)}
  .h-say .n{font-size:12px;color:var(--who);font-weight:700}
  .h-say .n small{color:var(--dim);font-weight:400;margin-left:8px}
  .h-say .x{font-size:15.5px;white-space:pre-wrap;word-break:break-word}

  .round{display:flex;align-items:center;gap:10px;margin:26px 0 8px;color:var(--gold);font-family:var(--mincho);font-size:13px;letter-spacing:.12em}
  .round::before,.round::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d),transparent)}

  .ai{display:flex;gap:10px;margin:12px 0;max-width:88%}
  .ai.right{margin-left:auto;flex-direction:row-reverse}
  .av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--who);border:1.5px solid var(--who);margin-top:2px}
  .bub{background:var(--s1);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
  .ai.right .bub{border-radius:16px 4px 16px 16px;background:var(--s2)}
  .bub .n{font-size:11.5px;font-weight:700;color:var(--who)}
  .bub .n small{color:var(--dim);font-weight:400;margin-left:6px}
  .bub .x{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .keep{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--dim);margin-top:4px}
  .keep svg{width:13px;height:13px}
  .typing{display:flex;gap:5px;align-items:center;color:var(--sub);font-size:12.5px;margin:12px 0}
  .typing.right{justify-content:flex-end}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--who);animation:bl 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .sys{text-align:center;color:var(--dim);font-size:12px;margin:16px 0}

  /* まとめ */
  .verdict{margin:28px 0 12px;border:1px solid var(--gold-d);border-radius:18px;background:linear-gradient(180deg,var(--gold-t),transparent 70%);padding:18px 18px 8px;position:relative}
  .verdict h3{font-family:var(--mincho);font-size:18px;letter-spacing:.1em;color:var(--gold);margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .verdict h3 svg{width:18px;height:18px}
  .verdict .pts{white-space:pre-wrap;color:var(--sub);font-size:13.5px;margin-bottom:10px}
  .prop{border-top:1px solid var(--line);padding:14px 0 10px}
  .prop .pt{font-size:14.5px;font-weight:500}
  .prop .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  .prop .st{display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:6px;color:var(--gold)}
  .prop .st svg{width:14px;height:14px}
  .prop.rej .pt{color:var(--dim);text-decoration:line-through}
  .prop.rej .st{color:var(--dim)}

  /* 入力欄 */
  .composer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:19;padding:10px 14px;
    background:linear-gradient(180deg,transparent,var(--bg) 22%)}
  .composer .wrap{max-width:680px;margin:0 auto}
  .cbar{display:flex;align-items:flex-end;gap:8px;background:var(--s1);border:1px solid var(--line2);border-radius:24px;padding:6px 6px 6px 16px}
  .cbar textarea{border:none;background:transparent;padding:7px 0;min-height:36px;max-height:120px;resize:none}
  .send{width:38px;height:38px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;flex:none}
  .send svg{width:18px;height:18px}
  .dbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;border-radius:999px;padding:10px;
    border:1px solid var(--gold-d);color:var(--gold);font-size:13.5px;font-weight:700;background:var(--gold-t)}
  .dbtn svg{width:16px;height:16px}
  .dbtn.stop{border-color:var(--danger);color:var(--danger);background:rgba(224,122,110,.1)}

  /* 決定事項 */
  .dec{padding:18px 0;border-bottom:1px solid var(--line)}
  .dec:first-child{border-top:1px solid var(--line)}
  .dec .from{font-size:12px;color:var(--dim)}
  .dec .dt{font-family:var(--mincho);font-weight:700;font-size:16.5px;letter-spacing:.03em;margin:4px 0 10px;line-height:1.6}
  .dec.off .dt{color:var(--dim);text-decoration:line-through}
  .dec .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .dec .row .sp{flex:1}
  .tag{font-size:11px;border-radius:999px;padding:1px 9px;border:1px solid var(--gold-d);color:var(--gold)}
  .tag.off{border-color:var(--line2);color:var(--dim)}
  .tl{margin:14px 0 0 6px;border-left:1px solid var(--line2);padding-left:16px}
  .tl .e{position:relative;margin-bottom:12px;font-size:13px}
  .tl .e::before{content:"";position:absolute;left:-20.5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gold)}
  .tl .e b{font-weight:700}
  .tl .e .old{color:var(--dim);text-decoration:line-through;display:block}

  /* 保管庫 */
  .seg{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:18px;overflow-x:auto}
  .seg button{flex:1;padding:6px 10px;border-radius:999px;font-size:12.5px;color:var(--sub);white-space:nowrap}
  .seg button.on{background:var(--s2);color:var(--text)}
  .vi{padding:14px 0;border-bottom:1px solid var(--line)}
  .vi .vh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  .vi .vh .sp{flex:1}
  .vi .vx{white-space:pre-wrap;margin-top:6px;font-size:14px}
  pre.code{background:#0A1410;border:1px solid var(--line);color:#D6E2D9;border-radius:12px;padding:12px 14px;overflow:auto;font-size:12.5px;margin:8px 0 0;font-family:ui-monospace,Menlo,monospace}
  .linkbtn{font-size:12px;color:var(--sub)}

  /* 設定 */
  .grp{margin-bottom:32px}
  .grp p{margin:0 0 10px}
  label.f{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:16px 0 6px}
  label.f .d{width:8px;height:8px;border-radius:50%;background:var(--who)}
  .steps{display:flex;gap:6px}
  .steps button{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:12px;color:var(--sub)}
  .steps button.on{border-color:var(--gold);color:var(--gold);background:var(--gold-t)}
  .conn{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .conn span:last-child{color:var(--dim);font-size:12.5px}

  /* シート */
  .sheet{position:fixed;inset:0;background:rgba(5,10,8,.6);z-index:50;display:flex;align-items:flex-end;animation:fd .2s ease}
  .sheet .in{background:var(--s1);border-top:1px solid var(--line2);width:100%;border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
  .sheet .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px}
  .sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  @keyframes fd{from{opacity:0}}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hd"></header>
<div class="note">プレビュー版：AIの返事は見本です。データはこの端末の中にだけ保存されます。</div>
<main id="main"></main>
<div id="composer"></div>
<nav id="nav"></nav>
<div id="sheet"></div>

<script>
(function(){
"use strict";

/* ---------- 参加者 ---------- */
const P = {
  yama:   {name:"山川",   label:"山", color:"var(--yama)",   ai:false},
  ohara:  {name:"大原",   label:"大", color:"var(--ohara)",  ai:false},
  oai:    {name:"大原AI", label:"AI", color:"var(--oai)",    ai:true, sub:"ChatGPT"},
  claude: {name:"Claude", label:"C",  color:"var(--claude)", ai:true, sub:"Claude"}
};

/* ---------- 保存 ---------- */
const KEY = "bon31-meeting-preview-v1";
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function now(){ return Date.now(); }
function seed(){
  const t = now();
  const mId = uid();
  return {
    me: "yama",
    meetings: [{
      id: mId, title: "（サンプル）会議アプリの進め方", createdAt: t,
      messages: [
        {id:uid(), who:"yama", ts:t, text:"会議アプリ、まずはプレビュー版で画面を確認してから本番に進めたい。"},
        {id:uid(), who:"oai", ts:t, text:"賛成です。まず2人が毎日開きたくなる画面かどうかを確かめましょう。営業の打ち合わせでも使えるよう、スマホでの見やすさを優先したいです。"},
        {id:uid(), who:"claude", ts:t, text:"異論はないですが、1点だけ。本番ではAPI代がかかるので、議論の往復回数に上限をつけておくべきです。最初は3往復を推します。"}
      ]
    }],
    decisions: [{
      id: uid(), text: "（サンプル）会議アプリはFirebaseで作る", meetingId: mId, meetingTitle:"（サンプル）会議アプリの進め方",
      createdAt: t, by: "yama", status: "有効",
      history: [{ts:t, by:"yama", action:"採用", from:"", to:"（サンプル）会議アプリはFirebaseで作る"}]
    }],
    vault: [{
      id: uid(), tag: "コード", ts: t, by: "claude", meetingTitle: "（サンプル）会議アプリの進め方",
      text: "// 例：AIの往復回数の上限\nconst MAX_ROUNDS = 3;"
    }],
    settings: {
      rounds: 3,
      roleOai: "攻め役。営業・アイデア・お客さん目線で、前向きな案を出す。",
      roleClaude: "突っ込み役。リスク・実装・お金・スケジュールの観点で、必ず反論か懸念を1つ出す。",
      handoffOai: "", handoffClaude: ""
    }
  };
}
let S;
function load(){
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : seed(); }
  catch(e){ S = seed(); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
load();

/* ---------- 画面状態 ---------- */
let view = {tab:"meet", meetingId:null, vaultTag:"すべて", openHist:{}};
let running = null; // {meetingId, stop:false}

/* ---------- ユーティリティ ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(ts){ const d=new Date(ts); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }
function meeting(id){ return S.meetings.find(m => m.id === id); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function short(s, n){ s = s.replace(/\s+/g," ").trim(); return s.length > n ? s.slice(0,n) + "…" : s; }

/* ---------- ダミーAI ---------- */
const OAI_LINES = [
  t => `「${t}」について、まずはお客さん側から考えましょう。枚方・交野・寝屋川の事業所なら、紹介や口コミが一番強いと思います。小さく始めて、反応が良いところに集中するのがいいです。`,
  t => `いい指摘です。そこは押さえつつ、スピードも大事にしたいです。「${t}」は、2週間だけ試して数字で判断する、という形にすれば動きやすいと思います。`,
  t => `なるほど。それなら費用をかけずにできる方法から始めましょう。手持ちのチラシとSNSで反応を見て、手応えがあれば次の手を打つ、という順番でどうでしょう。`,
  t => `お客さん目線で言うと、「わかりやすさ」が一番です。説明が1分で終わる形に絞れば、成約率は上がると思います。`
];
const CLAUDE_LINES = [
  t => `方向性には賛成です。ただ懸念が1つあります。「${t}」は、誰がいつまでに何をやるかが決まっていないと止まりがちです。担当と期限を先に決めましょう。`,
  t => `反論を1つ。2週間で判断するなら、何を見て判断するかを先に決めておかないと、結局ずるずる続きます。「問い合わせ件数○件以上なら続行」のような基準が必要です。`,
  t => `費用をかけない案はいいと思います。ただ、時間のコストも見ておくべきです。2人とも本業があるので、週に使える時間を先に決めておかないと無理が出ます。`,
  t => `リスク面で言うと、最初の数件で失敗すると口コミが逆に効いてしまいます。最初はよく知っているお客さんから始めて、やり方を固めてから広げるのが安全です。`
];
function pickLine(arr, i, topic){ return arr[i % arr.length](short(topic, 18)); }

function makeSummary(topic){
  const t = short(topic, 22);
  return {
    text: `【まとめ】「${t}」\n論点：\n・スピードを優先するか、慎重に進めるか\n・判断の基準と担当・期限が決まっていない\n・2人の使える時間に限りがある`,
    proposals: [
      {id:uid(), text:`「${t}」は2週間のお試しで進め、問い合わせ件数で続けるか判断する`, status:"未決"},
      {id:uid(), text:"担当と期限を決める（例：山川＝準備、大原＝連絡、期限は来週金曜）", status:"未決"},
      {id:uid(), text:"最初は知り合いのお客さんから始めて、やり方を固める", status:"未決"}
    ]
  };
}

function humanSince(m, idx){
  // 直前の議論開始以降に人間が書き込んだ内容
  return m.messages.slice(idx).filter(x => P[x.who] && !P[x.who].ai && x.kind !== "summary").pop();
}

async function runDebate(mId){
  const m = meeting(mId);
  if (!m || running) return;
  const topic = m.title;
  const startIdx = m.messages.length;
  running = {meetingId:mId, stop:false};
  const rounds = Math.max(1, Math.min(5, S.settings.rounds|0));
  let seen = null;
  bgRender();
  for (let r = 0; r < rounds; r++){
    for (const who of ["oai","claude"]){
      if (running.stop) break;
      running.typing = who; bgRender();
      await sleep(1100 + Math.random()*700);
      if (running.stop) break;
      let text = pickLine(who === "oai" ? OAI_LINES : CLAUDE_LINES, r, topic);
      const h = humanSince(m, startIdx);
      if (h && h !== seen){
        text = `（${P[h.who].name}さんの「${short(h.text, 16)}」を踏まえて）\n` + text;
        seen = h;
      }
      m.messages.push({id:uid(), who, ts:now(), text, round:r+1});
      save(); bgRender();
    }
    if (running.stop) break;
  }
  if (!running.stop){
    running.typing = "claude"; bgRender();
    await sleep(1200);
    const sm = makeSummary(topic);
    m.messages.push({id:uid(), who:"claude", ts:now(), kind:"summary", text:sm.text, proposals:sm.proposals});
  } else {
    m.messages.push({id:uid(), who:"system", ts:now(), text:"議論を途中で止めました。"});
  }
  running = null;
  save(); bgRender();
}

/* ---------- 決定事項 ---------- */
function adopt(mId, msgId, propId, text){
  const m = meeting(mId); if (!m) return;
  const msg = m.messages.find(x => x.id === msgId); if (!msg) return;
  const p = msg.proposals.find(x => x.id === propId); if (!p) return;
  const finalText = (text || p.text).trim(); if (!finalText) return;
  p.status = text && text.trim() !== p.text ? "修正して採用" : "採用";
  p.text = finalText;
  S.decisions.unshift({
    id:uid(), text:finalText, meetingId:mId, meetingTitle:m.title, createdAt:now(), by:S.me, status:"有効",
    history:[{ts:now(), by:S.me, action:p.status, from:"", to:finalText}]
  });
  save(); render();
}
function reject(mId, msgId, propId){
  const m = meeting(mId); const msg = m && m.messages.find(x => x.id === msgId);
  const p = msg && msg.proposals.find(x => x.id === propId); if (!p) return;
  p.status = "却下"; save(); render();
}
function editDecision(id, newText){
  const d = S.decisions.find(x => x.id === id); if (!d) return;
  newText = newText.trim(); if (!newText || newText === d.text) return;
  d.history.push({ts:now(), by:S.me, action:"変更", from:d.text, to:newText});
  d.text = newText; save(); render();
}
function toggleDecision(id){
  const d = S.decisions.find(x => x.id === id); if (!d) return;
  const next = d.status === "有効" ? "取消" : "有効";
  d.history.push({ts:now(), by:S.me, action: next === "取消" ? "取消" : "復活", from:d.text, to:d.text});
  d.status = next; save(); render();
}

/* ---------- アイコン ---------- */
const I = {
  mark:`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 13c3-4 8-5 11-3 2-3 7-3 9 1-2 2-5 2-7 1-2 2-6 3-9 2"/><path d="M16 11c0 4-1 7-3 10"/><path d="M13 21c2-1 4-1 6 0"/><path d="M8 24h16l-2 4H10z"/></svg>`,
  back:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  meet:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 5h11v8H8l-4 3z"/><path d="M15 9h5v8l-3-2h-6v-2"/></svg>`,
  dec:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 13l2.5 2.5L16 11"/></svg>`,
  vault:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 8h18v12H3z"/><path d="M5 8V5h14v3"/><path d="M10 12h4"/></svg>`,
  set:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>`,
  send:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`,
  spark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 7c3 0 4 2 4 5M16 17c-3 0-4-2-4-5"/><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="17" r="2.2"/></svg>`,
  stop:`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>`,
  keep:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4z"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  seal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};

/* ---------- シート ---------- */
function openSheet(html){ $("sheet").innerHTML = `<div class="sheet" data-act="closeSheet"><div class="in"><div class="grab"></div>${html}</div></div>`; }
function closeSheet(){ $("sheet").innerHTML = ""; }

/* ---------- 描画 ---------- */
function bgRender(){ if (view.tab === "meet") render(); else renderNav(); }
function render(){
  renderHeader(); renderNav();
  const main = $("main"), comp = $("composer");
  const oldInp = $("inp"); const draft = oldInp ? oldInp.value : ""; const hadFocus = oldInp && document.activeElement === oldInp;
  comp.innerHTML = "";
  if (view.tab === "meet" && view.meetingId && meeting(view.meetingId)){
    main.innerHTML = renderThread(); comp.innerHTML = renderComposer(); main.style.paddingBottom = "210px";
    const ni = $("inp"); if (ni){ ni.value = draft; if (hadFocus) ni.focus(); }
    scrollBottom(); return;
  }
  main.style.paddingBottom = "";
  if (view.tab === "meet"){ view.meetingId = null; main.innerHTML = renderMeetings(); }
  if (view.tab === "dec") main.innerHTML = renderDecisions();
  if (view.tab === "vault") main.innerHTML = renderVault();
  if (view.tab === "set") main.innerHTML = renderSettings();
}
let lastLen = -1;
function scrollBottom(){
  const m = meeting(view.meetingId); const len = m.messages.length + (running ? 1 : 0);
  if (len !== lastLen){ lastLen = len; requestAnimationFrame(() => window.scrollTo({top:document.body.scrollHeight, behavior: lastLen > 0 ? "smooth" : "auto"})); }
}
function dot(k){ return `<span class="dot" style="background:${P[k].color}">${P[k].name.slice(0,1)}</span>`; }
function renderHeader(){
  const m = view.tab === "meet" && view.meetingId ? meeting(view.meetingId) : null;
  const titles = {meet:"会議室", dec:"決定事項", vault:"保管庫", set:"設定"};
  $("hd").innerHTML =
    (m ? `<button class="back" data-act="back" aria-label="一覧に戻る">${I.back}</button>` : `<span class="mark">${I.mark}</span>`) +
    `<h1>${esc(m ? m.title : titles[view.tab])}</h1>` +
    `<button class="me" data-act="switchMe">${dot(S.me)}${esc(P[S.me].name)}</button>`;
}
function renderNav(){
  const items = [["meet","会議"],["dec","決定事項"],["vault","保管庫"],["set","設定"]];
  $("nav").innerHTML = items.map(([k,l]) => `<button class="${view.tab===k?"on":""}" data-act="tab" data-tab="${k}">${I[k]}${l}</button>`).join("");
}
function renderMeetings(){
  const list = [...S.meetings].sort((a,b) => (b.messages.at(-1)?.ts||b.createdAt) - (a.messages.at(-1)?.ts||a.createdAt));
  return `
  <div class="start">
    <input type="text" id="newTitle" placeholder="話し合いたいことを書く">
    <button class="btn" data-act="newMeeting">始める</button>
  </div>
  <h2 class="sec-title">これまでの会議</h2>
  ${list.length ? `<div class="mlist">${list.map(m => {
    const last = m.messages.at(-1);
    const dec = S.decisions.filter(d => d.meetingId === m.id && d.status === "有効").length;
    return `<button class="mrow" data-act="openMeeting" data-id="${m.id}">
      <span class="t">${esc(m.title)}</span>
      <span class="l">${last ? esc((P[last.who]?.name || "") + "：" + short(last.text, 40)) : "まだ発言はありません"}</span>
      <span class="meta"><span>${fmt(last ? last.ts : m.createdAt)}</span><span>発言 ${m.messages.filter(x=>P[x.who]).length}</span>${dec ? `<span class="g">決定 ${dec}</span>` : ""}</span>
    </button>`;
  }).join("")}</div>` : `<p class="empty">まだ会議はありません。上の欄に話し合いたいことを書いて始めましょう。</p>`}`;
}
function keepBtn(m, x){ return `<button class="keep" data-act="keep" data-m="${m.id}" data-msg="${x.id}">${I.keep}保管</button>`; }
function renderMsg(m, x, prev){
  if (x.who === "system") return `<p class="sys">${esc(x.text)}</p>`;
  const p = P[x.who];
  if (x.kind === "summary"){
    return `<section class="verdict" style="--who:${p.color}">
      <h3>${I.seal}まとめ</h3>
      <div class="pts">${esc(x.text.replace(/^【まとめ】.*\n/, ""))}</div>
      ${x.proposals.map(pr => {
        const done = pr.status !== "未決";
        return `<div class="prop ${pr.status==="却下"?"rej":""}">
          <div class="pt">${esc(pr.text)}</div>
          ${done ? `<div class="st">${pr.status==="却下" ? "" : I.check}${esc(pr.status)}</div>` :
          `<div class="acts">
            <button class="btn line sm" data-act="rejectProp" data-m="${m.id}" data-msg="${x.id}" data-p="${pr.id}">却下</button>
            <button class="btn line sm" data-act="editProp" data-m="${m.id}" data-msg="${x.id}" data-p="${pr.id}">直して採用</button>
            <button class="btn sm" data-act="adoptProp" data-m="${m.id}" data-msg="${x.id}" data-p="${pr.id}">採用</button>
          </div>`}
        </div>`;
      }).join("")}
    </section>`;
  }
  if (!p.ai){
    return `<div class="h-say" style="--who:${p.color}">
      <div class="n">${esc(p.name)}<small>${fmt(x.ts)}</small></div>
      <div class="x">${esc(x.text)}</div>
      ${keepBtn(m, x)}
    </div>`;
  }
  const roundMark = x.round && (!prev || prev.round !== x.round) ? `<div class="round">第${x.round}往復</div>` : "";
  return `${roundMark}<div class="ai ${x.who==="claude"?"right":""}" style="--who:${p.color}">
    <div class="av">${x.who==="oai"?"AI":"C"}</div>
    <div class="bub">
      <div class="n">${esc(p.name)}<small>${fmt(x.ts)}</small></div>
      <div class="x">${esc(x.text)}</div>
      ${keepBtn(m, x)}
    </div>
  </div>`;
}
function renderThread(){
  const m = meeting(view.meetingId);
  const html = m.messages.map((x, i) => renderMsg(m, x, m.messages[i-1])).join("");
  let typing = "";
  if (running && running.meetingId === m.id && running.typing){
    const k = running.typing;
    typing = `<div class="typing ${k==="claude"?"right":""}" style="--who:${P[k].color}"><i></i><i></i><i></i>${esc(P[k].name)}が考えています</div>`;
  }
  return `<div class="thread">${html}${typing}</div>`;
}
function renderComposer(){
  const busy = !!running;
  return `<div class="composer"><div class="wrap">
    <div class="cbar">
      <textarea id="inp" rows="1" placeholder="${busy ? "議論に割り込む" : "意見や条件を書く"}"></textarea>
      <button class="send" data-act="send" aria-label="送信">${I.send}</button>
    </div>
    ${busy
      ? `<button class="dbtn stop" data-act="stop">${I.stop}議論を止める</button>`
      : `<button class="dbtn" data-act="debate">${I.spark}AI同士で議論させる（${S.settings.rounds}往復）</button>`}
  </div></div>`;
}
function renderDecisions(){
  if (!S.decisions.length) return `<p class="empty">まだ決定事項はありません。会議のまとめで「採用」を押すと、ここに入ります。</p>`;
  return `<p class="muted" style="margin:0 0 16px">変更や取り消しをすると、前の内容が履歴に残ります。</p><div>` +
  S.decisions.map(d => {
    const open = view.openHist[d.id], off = d.status === "取消";
    return `<article class="dec ${off?"off":""}">
      <div class="from">${esc(d.meetingTitle||"")}</div>
      <div class="dt">${esc(d.text)}</div>
      <div class="row">
        <span class="tag ${off?"off":""}">${off?"取消":"有効"}</span>
        <button class="linkbtn" data-act="hist" data-id="${d.id}">履歴 ${d.history.length}件${open?"を閉じる":"を見る"}</button>
        <span class="sp"></span>
        <button class="btn line sm" data-act="toggleDec" data-id="${d.id}">${off?"元に戻す":"取り消す"}</button>
        <button class="btn line sm" data-act="editDec" data-id="${d.id}">変更</button>
      </div>
      ${open ? `<div class="tl">${[...d.history].reverse().map(h => `<div class="e"><b>${esc(P[h.by]?.name||"")}が${esc(h.action)}</b> <span class="muted">${fmt(h.ts)}</span>${h.action==="変更" ? `<span class="old">${esc(h.from)}</span>${esc(h.to)}` : ""}</div>`).join("")}</div>` : ""}
    </article>`;
  }).join("") + `</div>`;
}
function renderVault(){
  const tags = ["すべて","コード","資料","TODO","メモ"];
  const list = S.vault.filter(v => view.vaultTag === "すべて" || v.tag === view.vaultTag);
  return `<div class="seg">${tags.map(t => `<button class="${view.vaultTag===t?"on":""}" data-act="vtag" data-t="${t}">${t}</button>`).join("")}</div>
  ${list.length ? list.map(v => `<div class="vi">
    <div class="vh"><span class="tag">${esc(v.tag)}</span><span>${esc(P[v.by]?.name||"")}・${fmt(v.ts)}</span><span class="sp"></span>
    <button class="linkbtn" data-act="delVault" data-id="${v.id}">削除</button></div>
    ${v.tag==="コード" ? `<pre class="code">${esc(v.text)}</pre>` : `<div class="vx">${esc(v.text)}</div>`}
    <div class="muted" style="font-size:12px;margin-top:4px">${esc(v.meetingTitle||"")}</div>
  </div>`).join("") : `<p class="empty">まだありません。会議の発言についている「保管」から追加できます。</p>`}`;
}
function renderSettings(){
  const s = S.settings;
  return `<section class="grp">
    <h2 class="sec-title">AI同士の議論</h2>
    <p class="muted">1回の議論で何往復させるか</p>
    <div class="steps">${[1,2,3,4,5].map(n => `<button class="${s.rounds===n?"on":""}" data-act="setRounds" data-n="${n}">${n}</button>`).join("")}</div>
    <label class="f" style="--who:var(--oai)"><span class="d"></span>大原AIの役割</label>
    <textarea id="setRoleOai" rows="2">${esc(s.roleOai)}</textarea>
    <label class="f" style="--who:var(--claude)"><span class="d"></span>Claudeの役割</label>
    <textarea id="setRoleClaude" rows="2">${esc(s.roleClaude)}</textarea>
  </section>
  <section class="grp">
    <h2 class="sec-title">これまでの経緯（引き継ぎ書）</h2>
    <p class="muted">最初に1回だけ登録します。本番版では、AIが毎回これと決定事項を読んでから会議に参加します。</p>
    <label class="f" style="--who:var(--oai)"><span class="d"></span>大原AIの引き継ぎ書</label>
    <textarea id="setHoOai" rows="4" placeholder="ChatGPTに作ってもらったまとめを貼る">${esc(s.handoffOai)}</textarea>
    <label class="f" style="--who:var(--claude)"><span class="d"></span>Claudeの引き継ぎ書</label>
    <textarea id="setHoClaude" rows="4" placeholder="Claudeが作ったまとめを貼る">${esc(s.handoffClaude)}</textarea>
    <div style="text-align:right;margin-top:14px"><button class="btn" data-act="saveSettings">保存する</button></div>
  </section>
  <section class="grp">
    <h2 class="sec-title">AIの接続</h2>
    <div class="conn"><span>大原AI（ChatGPT）</span><span>未接続・見本の返事</span></div>
    <div class="conn"><span>Claude</span><span>未接続・見本の返事</span></div>
    <p class="muted" style="margin-top:10px">本番版では、APIキーを外から見えない場所に入れて本物のAIにつなぎます。</p>
  </section>
  <section class="grp">
    <h2 class="sec-title">データ</h2>
    <p class="muted">この端末のプレビューデータを消して、最初の状態に戻します。</p>
    <button class="btn line sm" data-act="reset">リセットする</button>
  </section>`;
}

/* ---------- 操作 ---------- */
document.addEventListener("input", e => {
  if (e.target.id === "inp"){ e.target.style.height = "auto"; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px"; }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "newTitle" && e.key === "Enter" && !e.isComposing){ e.preventDefault(); document.querySelector("[data-act=newMeeting]").click(); }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "closeSheet"){ if (e.target === el) closeSheet(); return; }
  if (a === "tab"){ view.tab = el.dataset.tab; if (view.tab !== "meet") view.meetingId = null; window.scrollTo(0,0); render(); }
  else if (a === "back"){ view.meetingId = null; render(); window.scrollTo(0,0); }
  else if (a === "switchMe"){
    openSheet(`<h2 class="sec-title">誰として書き込みますか</h2>` + ["yama","ohara"].map(k => `<button class="opt" data-act="setMe" data-k="${k}" style="--who:${P[k].color}"><span class="me" style="border:none;padding:0">${dot(k)}</span>${P[k].name}${S.me===k?`<span class="muted" style="margin-left:auto">選択中</span>`:""}</button>`).join("") +
      `<p class="muted" style="margin-top:12px">本番版では、それぞれのログインで自動的に切り替わります。</p>`);
  }
  else if (a === "setMe"){ S.me = el.dataset.k; save(); closeSheet(); render(); }
  else if (a === "newMeeting"){
    const t = $("newTitle").value.trim(); if (!t){ $("newTitle").focus(); return; }
    const m = {id:uid(), title:t, createdAt:now(), messages:[{id:uid(), who:S.me, ts:now(), text:t}]};
    S.meetings.push(m); save(); view.meetingId = m.id; lastLen = -1; render();
  }
  else if (a === "openMeeting"){ view.meetingId = el.dataset.id; lastLen = -1; render(); }
  else if (a === "send"){
    const t = $("inp").value.trim(); if (!t) return;
    meeting(view.meetingId).messages.push({id:uid(), who:S.me, ts:now(), text:t}); $("inp").value = ""; $("inp").style.height = ""; save(); render();
  }
  else if (a === "debate"){ runDebate(view.meetingId); }
  else if (a === "stop"){ if (running) running.stop = true; }
  else if (a === "adoptProp"){ adopt(el.dataset.m, el.dataset.msg, el.dataset.p); }
  else if (a === "rejectProp"){ reject(el.dataset.m, el.dataset.msg, el.dataset.p); }
  else if (a === "editProp"){
    const m = meeting(el.dataset.m), msg = m.messages.find(x => x.id === el.dataset.msg), p = msg.proposals.find(x => x.id === el.dataset.p);
    openSheet(`<h2 class="sec-title">直して採用する</h2><textarea id="sheetTxt" rows="4">${esc(p.text)}</textarea>
      <div class="acts"><button class="btn line" data-act="closeSheetBtn">やめる</button><button class="btn" data-act="doEditProp" data-m="${m.id}" data-msg="${msg.id}" data-p="${p.id}">この内容で採用</button></div>`);
  }
  else if (a === "doEditProp"){ const t = $("sheetTxt").value; closeSheet(); adopt(el.dataset.m, el.dataset.msg, el.dataset.p, t); }
  else if (a === "hist"){ view.openHist[el.dataset.id] = !view.openHist[el.dataset.id]; render(); }
  else if (a === "toggleDec"){ toggleDecision(el.dataset.id); }
  else if (a === "editDec"){
    const d = S.decisions.find(x => x.id === el.dataset.id);
    openSheet(`<h2 class="sec-title">決定事項を変更する</h2><p class="muted">変更前の内容は履歴に残ります。</p><textarea id="sheetTxt" rows="4">${esc(d.text)}</textarea>
      <div class="acts"><button class="btn line" data-act="closeSheetBtn">やめる</button><button class="btn" data-act="doEditDec" data-id="${d.id}">変更する</button></div>`);
  }
  else if (a === "doEditDec"){ const t = $("sheetTxt").value; closeSheet(); editDecision(el.dataset.id, t); }
  else if (a === "keep"){
    openSheet(`<h2 class="sec-title">どこに保管しますか</h2>` + ["コード","資料","TODO","メモ"].map(t => `<button class="opt" data-act="doKeep" data-t="${t}" data-m="${el.dataset.m}" data-msg="${el.dataset.msg}">${t}</button>`).join(""));
  }
  else if (a === "doKeep"){
    const m = meeting(el.dataset.m), msg = m.messages.find(x => x.id === el.dataset.msg);
    S.vault.unshift({id:uid(), tag:el.dataset.t, ts:now(), by:msg.who, meetingTitle:m.title, text:msg.text});
    save(); closeSheet(); render();
  }
  else if (a === "vtag"){ view.vaultTag = el.dataset.t; render(); }
  else if (a === "delVault"){ S.vault = S.vault.filter(v => v.id !== el.dataset.id); save(); render(); }
  else if (a === "setRounds"){ S.settings.rounds = parseInt(el.dataset.n, 10); save(); document.querySelectorAll("[data-act=setRounds]").forEach(b => b.classList.toggle("on", b === el)); }
  else if (a === "saveSettings"){
    S.settings.roleOai = $("setRoleOai").value; S.settings.roleClaude = $("setRoleClaude").value;
    S.settings.handoffOai = $("setHoOai").value; S.settings.handoffClaude = $("setHoClaude").value;
    save(); el.textContent = "保存しました"; setTimeout(() => { el.textContent = "保存する"; }, 1500);
  }
  else if (a === "reset"){
    openSheet(`<h2 class="sec-title">リセットしますか</h2><p class="muted">この端末のプレビューデータがすべて消えます。</p>
      <div class="acts"><button class="btn line" data-act="closeSheetBtn">やめる</button><button class="btn danger" data-act="doReset">リセットする</button></div>`);
  }
  else if (a === "closeSheetBtn"){ closeSheet(); }
  else if (a === "doReset"){ S = seed(); save(); closeSheet(); view = {tab:"meet", meetingId:null, vaultTag:"すべて", openHist:{}}; render(); }
});

render();
})();
</script>
</body>
</html>
